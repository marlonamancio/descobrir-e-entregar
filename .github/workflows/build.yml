name: Build e lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Lint do Markdown e build do site
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório com o histórico completo
        uses: actions/checkout@v7
        with:
          # lastUpdated e o futuro reconhecimento de colaboradores leem o histórico do Git.
          fetch-depth: 0

      - name: Instalar o Node indicado no .nvmrc
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Lint do Markdown
        run: npm run lint:md

      - name: Build (inclui a validação de links)
        run: npm run build
